[package]
name = "lotus-graph-run"
version = "0.1.0"
edition = "2021"
description = "Graph Run engine for Lotus: scope, shared slot pool, budget cap, checkpoint, resume. Must not depend on tauri (ADR-0049 §6)."
publish = false

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
thiserror = "1"
toml = "0.9"
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "process", "io-util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
