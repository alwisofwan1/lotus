[package]
name = "lotus-sessiond"
version = "0.1.0"
edition = "2021"
description = "Lotus session daemon (ADR-0067): owns PTY sessions so they outlive the app. Must not depend on tauri."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lotus-pty = { path = "../lotus-pty" }
libc = "0.2"

[dev-dependencies]
vt100 = "0.16"
