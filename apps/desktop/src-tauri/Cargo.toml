[package]
name = "lotus"
version = "0.1.0"
description = "Lotus — Claude Agent Teams Desktop App"
authors = []
edition = "2021"

[lib]
name = "lotus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lotus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "protocol-asset", "macos-private-api", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The system time zone for automation authoring (already in the tree through chrono).
iana-time-zone = "0.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
thiserror = "1"
libc = "0.2"
dirs = "5"
ureq = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
encoding_rs = "0.8"
ignore = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lotus-automation = { path = "crates/lotus-automation" }
lotus-pty = { path = "crates/lotus-pty" }
lotus-sessiond = { path = "crates/lotus-sessiond" }
lotus-graph-run = { path = "crates/lotus-graph-run" }
# OS credential store for automation secrets (Slack tokens): macOS Keychain, Windows
# Credential Manager, Linux Secret Service. ADR-0038 / PLAN §2.2 Q18.
keyring = "4"
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
parking_lot = "0.12"
percent-encoding = "2"
notify-debouncer-mini = "0.4"
tokio-tungstenite = { version = "0.23", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# PNG decode/crop/encode for self-calibrating annotation screenshot cropping (png only — lean).
image = { version = "0.25", default-features = false, features = ["png"] }
if-addrs = "0.15.0"
vt100 = "0.16"
tauri-plugin-updater = "~2.10.0"
tauri-plugin-process = "~2.3.0"

[dev-dependencies]
tempfile = "3"
# Mock runtime for exercising webview-dependent commands without a real window.
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSImage", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSData", "NSDictionary", "NSFileManager", "NSURL", "NSError"] }
objc2-core-foundation = "0.3.2"
# Native WKWebView screenshot capture for Canvas browser nodes (takeSnapshot).
block2 = "0.6.2"
objc2-web-kit = { version = "0.3.2", features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKSnapshotConfiguration"] }

# Debug builds keep line tables and drop everything else from the debuginfo. Measured
# 2026-08-27: `target/` had grown to 70 GB in two months, ~40 GB of it codegen objects of
# `lotus_lib` across 13 stale hash variants, each carrying full debuginfo. Backtraces and
# panics still name file:line; what goes is variable inspection in lldb, which nobody
# here has used on this crate. Flip to `debug = true` locally when you need it.
[profile.dev]
debug = "line-tables-only"

# One target/ and one Cargo.lock for the app and its internal crates (ADR-0038).
[workspace]
members = ["crates/lotus-automation", "crates/lotus-graph-run", "crates/lotus-pty", "crates/lotus-sessiond"]
