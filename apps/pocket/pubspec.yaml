name: lotus_pocket
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
#
# **Only the name half is read.** `scripts/release.sh` computes the build number itself —
# minutes since the Unix epoch — so it rises on every build from every branch and never
# needs editing here. See `scripts/version.sh` for why a timestamp and not a counter.
# Bump the name (semver) when what the operator sees changes.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  xterm: ^4.0.0
  # The other half of the transport seam (ADR-13 no. 4). Dart-team first-party, and
  # already named in test/architecture/layering_test.dart — `features/` may not touch it.
  http: ^1.6.0
  # Keychain / Keystore for device tokens — named by PLAN.md §ADR-5, so this is a
  # decision being carried out rather than one made here. Behind core/secure_store.dart.
  flutter_secure_storage: ^10.3.1
  # The biometric gate every mutation passes (ADR-8, ADR-12 no. 4). Ships from
  # flutter/packages — the same paved road ADR-1 and ADR-10 argued for.
  local_auth: ^3.0.2
  # Background wake-ups (ADR-4). `firebase_core` is not optional extra weight —
  # `firebase_messaging` cannot initialise without it. Both are FlutterFire
  # first-party, and they bring their own native dependencies: the Firebase BoM and
  # `firebase-messaging` artefacts the console suggests adding to Gradle must NOT be
  # added, or the same native library arrives twice at two versions.
  #
  # No local-notification package: the host sends a `notification` block, so Android
  # draws the wake-up itself (see `push/fcm-sender.ts`).
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  # The agent writes markdown and Chat used to print it literally — `##`, backticks
  # and `**bold**` on screen as characters. Measured across 279 real assistant
  # messages: inline code 30%, bold 27%, fenced code 25%, bullets 17%, headings 10%,
  # links 9%, nested lists 4%, tables 4%. A hand-rolled subset would cover the top of
  # that list and get the tail wrong, and the tail is where a bad render is worst — a
  # mangled table is less readable than the raw pipes.
  #
  # This one rather than `flutter_markdown`, which is discontinued and points at a
  # replacement; `gpt_markdown` is built for LLM output that arrives in pieces, which
  # is exactly the stream `LiveTranscript` now feeds it. Pure Dart, no native
  # dependency — which matters because ADR-9 ships this as a sideloaded APK.
  gpt_markdown: ^1.1.8
  mobile_scanner: ^7.4.0
  # Dictation's missing half. `HostApi.transcribe`, `AgentRepository.transcribe`, the
  # `Transcription` model and `POST /m/stt` all existed and were tested with **zero
  # callers** — a producer with no client, the same shape as `cell.output` and the QR.
  # This is what finally presses the button.
  #
  # minSdk 23, which is exactly where `flutter_secure_storage` already put this app, so
  # dictation costs no floor. Records AAC-LC into an m4a container on purpose: the host
  # maps `audio/mp4` to `audio.mp4` in `filename_for_mime` (voice_http.rs), which is a
  # shape the provider accepts — and AAC keeps a 30-second clip near 60 KB where raw PCM
  # would be a megabyte over somebody's cellular link.
  #
  # It also reports amplitude in dBFS, which is what lets the level bar be real. Without
  # that the design falls back to a pulsing dot: a waveform animating on a timer rather
  # than on sound would tell the operator their microphone works when it may not.
  record: ^7.1.1
  # Declared rather than borrowed. `record` pulls it in transitively and needs a path to
  # record into, but a file this app opens by name is a file this app depends on.
  path_provider: ^2.1.6
  # A URL in a reply used to be text and nothing else, and `agent_prose.dart` argued the
  # case: a link from an agent usually points at the *machine it runs on* — a loopback
  # port, a path on that disk — so opening it here lands nowhere. That argument holds for
  # those links and was quietly applied to all of them, including the public ones an
  # agent cites while explaining itself. So the rule is now per-link rather than blanket:
  # this opens what a phone can actually reach, and the sheet says plainly when a target
  # belongs to the other machine.
  #
  # flutter/packages first-party, the same paved road ADR-1 and ADR-10 argued for, and it
  # needs the two `<queries>` intents added beside PROCESS_TEXT in the manifest.
  url_launcher: ^6.3.2
  # What Diagnostics prints as "this build", and the fallback when a build was made
  # without `scripts/release.sh` — a Play Store or App Store pipeline reads the version
  # the store sees, not one baked into Dart. Federated plugin from fluttercommunity,
  # no native dependency beyond the platform's own package manager.
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Symbols a TUI draws that no phone font has — Claude's `⏵⏵` printed as `□□`
  # (LOT2-104). Noto Sans Symbols 2, cut to its arrow, technical, shape, dingbat and
  # braille glyphs (218 KB of 1.2 MB) — it has no box drawing, which the phone draws
  # already. OFL, licence beside it.
  fonts:
    - family: LotusSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Subset.ttf
    # Graphite's UI and code faces: Geist 1.9.2 (vercel/geist-font, OFL, licence beside
    # it). Only the type scale's weights; a missing weight resolves to the nearest one.
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
